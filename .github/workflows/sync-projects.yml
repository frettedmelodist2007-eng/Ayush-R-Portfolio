name: Sync GitHub Projects

on:
  schedule:
    # Run everyday at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync projects from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-projects.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to projects.json
          if git status --porcelain lib/projects.json | grep -q 'M lib/projects.json' || git status --porcelain lib/projects.json | grep -q '?? lib/projects.json'; then
            echo "Changes detected in lib/projects.json. Committing..."
            git add lib/projects.json
            git commit -m "chore: auto-update github projects data"
            git push
          else
            echo "No changes in repository data. Skipping commit."
          fi
